name: taskflow

x-dns-config: &dns-config
  dns:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8

services:
  nginx:
    <<: *dns-config
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - client
      - server
    networks:
      - backend-net

  client:
    <<: *dns-config
    build: ./client
    networks:
      - backend-net

  server:
    <<: *dns-config
    build: ./server
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
      - postgres
    networks:
      - backend-net

  postgres:
    <<: *dns-config
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  pgdata: